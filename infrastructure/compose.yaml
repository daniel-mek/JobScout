services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["applyos_redis:/data"]
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: applyos
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-applyos-local}
      POSTGRES_DB: applyos
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - applyos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applyos -d applyos"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  applyos_redis:
  applyos_pg:
