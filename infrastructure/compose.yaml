services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: applyos
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-applyos-local}
      POSTGRES_DB: applyos
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - applyos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applyos -d applyos"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  applyos_pg:
