# How Scout turns a listing into a 0 to 100 score. Every number here shows up in the breakdown
# next to each match, so if a ranking looks wrong, change the number here and rerun.
# The raw total can go a little over 100; it is capped at 100.

# IT and CS roles receive equal role points in this fork.
# A title that matches no role is dropped before scoring, unless it hits a freshman/sophomore program;
# a program whose title names no role (e.g. "Explore Program") gets the "program" points instead of 0.
role:
  swe: 30
  ambassador: 28
  pm: 24
  it: 30
  design: 15
  program: 20
  none: 0

# Company tier from config/targets.yaml. Tier 3 is "everything else" and gets nothing extra.
tier:
  1: 20
  2: 15
  3: 0

# Eligibility signals. "strong" is a freshman/sophomore word or a named program (Explore, STEP, Ignite, Student
# Ambassador). For a freshman these are the most valuable finds Scout can make: the points are set so that
# any exploratory program, even at a Tier 3 company with no role word in the title, outranks a plain Tier 1 SWE
# posting (20 + 45 + 5 + 6 = 76 beats 30 + 20 + 5 + 6 = 61).
# "weak" is a bare "early career(s)" in the title, which is usually just a job level at banks.
early_career:
  strong: 45
  weak: 5

# Degrees field. Graduate-only listings never reach scoring; they are dropped in the filter step, so an empty
# degrees field is not a warning sign. The lists often leave it blank (every Microsoft row, for one), and
# those rows were landing just under the instant threshold, so unknown earns the same as Bachelor's listed.
degrees:
  bachelors_listed: 5
  unknown: 5

# Location. Priority = NJ, NYC, or remote in the US. US = anywhere else in the country. Other = outside the US.
location:
  priority: 15
  us: 6
  other: 0

# Freshness. Big tech SWE postings can close within days, so new ones float up.
# Postings older than 90 days are often filled or forgotten even when the list still says "active",
# so they lose points (the only negative number in this file). Older than max_age_days (targets.yaml) are dropped.
freshness:
  under_24h: 10
  under_7d: 5
  older: 0
  over_90d: -10

# Tiers that never take the over_90d penalty. Big companies keep one evergreen posting open all season
# (Apple's "Software Engineer Intern, Undergrad"), and the posting page check catches the ones that closed.
no_stale_penalty_tiers: [1, 2]

# Saved keywords from targets.yaml. A few points per hit in the title, capped so keywords never outrank role.
keywords:
  per_hit: 3
  max: 9

# Below this score a listing is still written to data/matches.json but never goes in the digest.
min_score: 30

# Alerts. A Tier 1 or Tier 2 posting at or above instant_min_score pushes the moment it is seen;
# any freshman/sophomore program or ambassador program pushes regardless of score.
# Everything else that passed the filters waits for the 7:00 PM digest, which carries the top digest_size.
instant_min_score: 60
digest_size: 10

