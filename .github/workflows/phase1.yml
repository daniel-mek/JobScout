name: ApplyOS application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: applyos
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: applyos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U applyos -d applyos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - run: pip install -r apps/api/requirements.lock -r requirements.txt
      - run: ruff check apps/api packages/job_sources
      - run: ruff format --check apps/api packages/job_sources
      - run: mypy apps/api/applyos
      - run: pytest -q apps/api/tests
      - name: PostgreSQL migrations and integration tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://applyos:ci-only-password@localhost:5432/applyos_test
        run: pytest -q apps/api/tests
      - run: python -m unittest discover -s tests -t .
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r apps/api/requirements.lock
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: phase1-browser-traces
          path: apps/web/test-results/
