# Scout cron. The repo is public, so GitHub Actions minutes are free and unlimited.
#
# One schedule: every hour at :17, all in watch mode. GitHub runs scheduled jobs late or skips them
# when it is busy, so the schedule is hourly and the 7:00 PM digest is not a schedule of its own:
# every run checks whether the digest is due (after 7:00 PM New York time, not yet sent today).
# Hours 10 and 11 UTC are skipped so nothing runs within half an hour of the 6:45 AM Morning Brief
# (that is 6:17 and 7:17 AM in summer time, 5:17 and 6:17 AM in winter).
on:
  schedule:
    - cron: "17 0-9,12-23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "watch, digest, or test"
        default: "watch"

permissions:
  contents: write   # the run commits data/ back to the repo

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # State (seen list, page baselines, matches) lives on the separate "data" branch so main
      # only holds code. It is checked out into data/ and committed back there after the run.
      - name: Check out the data branch into data/
        run: |
          git fetch --depth=1 origin data
          git worktree add -B data data origin/data

      - name: Pick the mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=watch" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull phone changes from the dashboard
        env:
          SCOUT_URL: ${{ secrets.SCOUT_URL }}
          SCOUT_INGEST_SECRET: ${{ secrets.SCOUT_INGEST_SECRET }}
        run: python -m scout.sync pull

      - name: Run Scout
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m scout.run --mode "${{ steps.mode.outputs.mode }}"

      - name: Push this run to the dashboard
        if: always()
        env:
          SCOUT_URL: ${{ secrets.SCOUT_URL }}
          SCOUT_INGEST_SECRET: ${{ secrets.SCOUT_INGEST_SECRET }}
        run: python -m scout.sync push

      - name: Commit data to the data branch
        if: always()
        working-directory: data
        run: |
          git config user.name "scout-bot"
          git config user.email "scout-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "data: ${{ steps.mode.outputs.mode }} run $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin data || true
            git push origin HEAD:data
          fi
